[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-lemmy-bridge"
version = "0.1.0"
description = "Discord forum to Lemmy community bridge"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "discord.py>=2.5.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.8.0",
  "sqlalchemy>=2.0.38",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
bridge-dump-users = "src.user_identity_dump:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
# Test discovery adds the vendored package root explicitly so framework and app
# tests both import the same in-repo discordops package during local runs.
pythonpath = [
  ".",
  "vendor/discordops",
]
testpaths = [
  "tests",
  "vendor/discordops/tests",
]
asyncio_mode = "auto"
