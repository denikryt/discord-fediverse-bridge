services:
  bridge:
    image: ${BRIDGE_IMAGE:-discord-fediverse-bridge}:${BRIDGE_VERSION:?BRIDGE_VERSION is required}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: sqlite:////data/bridge.db
      BRIDGE_BIND_HOST: 0.0.0.0
      BRIDGE_BIND_PORT: 8080
      BRIDGE_GATEWAY_URL: http://fedify-gateway:3000
      PROFILE_MEDIA_ROOT: /data/profile-media
      DEPLOYMENT_STATE_LOCK_PATH: /data/deployment-state.lock
      PROFILE_MEDIA_LOCK_PATH: /data/profile-media.lock
    ports:
      - "127.0.0.1:${BRIDGE_PUBLISHED_PORT:-8080}:8080"
    volumes:
      - bridge-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - bridge-internal

  fedify-gateway:
    image: ${GATEWAY_IMAGE:-discord-fediverse-bridge-fedify-gateway}:${BRIDGE_VERSION:?BRIDGE_VERSION is required}
    restart: unless-stopped
    # The public ActivityPub gateway must not receive Discord/OAuth credentials.
    # Compose interpolation uses the selected --env-file, not the bridge env_file.
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?required}
      FEDIFY_SHARED_SECRET: ${FEDIFY_SHARED_SECRET:?required}
      FEDIFY_ACTOR_IDENTIFIER: ${FEDIFY_ACTOR_IDENTIFIER:-bridge}
      FEDIFY_ACTOR_NAME: ${FEDIFY_ACTOR_NAME:-Discord Lemmy Bridge Gateway}
      FEDIFY_ACTOR_SUMMARY: ${FEDIFY_ACTOR_SUMMARY:-Receives ActivityPub activities from Lemmy and forwards normalized events to the Python bridge.}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_BIND_PORT: 3000
      BRIDGE_EVENTS_URL: http://bridge:8080/internal/activitypub/events
    ports:
      - "127.0.0.1:${GATEWAY_PUBLISHED_PORT:-3000}:3000"
    depends_on:
      bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - bridge-internal

  backup:
    image: ${BRIDGE_IMAGE:-discord-fediverse-bridge}:${BRIDGE_VERSION:?BRIDGE_VERSION is required}
    restart: unless-stopped
    command:
      - python
      - -m
      - src.db.backup
      - serve
      - --database
      - /data/bridge.db
      - --output-dir
      - /backups
      - --media-root
      - /data/profile-media
      - --deployment-lock
      - /data/deployment-state.lock
      - --media-lock
      - /data/profile-media.lock
      - --lock-timeout-seconds
      - ${PROFILE_MEDIA_LOCK_TIMEOUT_SECONDS:-30}
      - --interval-seconds
      - ${BACKUP_INTERVAL_SECONDS:-86400}
      - --retention-count
      - ${BACKUP_RETENTION_COUNT:-14}
    volumes:
      - bridge-data:/data
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      bridge:
        condition: service_healthy
    networks:
      - bridge-internal

volumes:
  bridge-data:
    name: ${BRIDGE_DATA_VOLUME:-discord-fediverse-bridge-data}

networks:
  bridge-internal: {}
