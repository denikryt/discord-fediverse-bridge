[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discordops"
version = "0.1.0"
description = "Declarative operation and precondition framework for Discord bots"
authors = [{name = "Danil Mirzoev", email = "danil.mirzoev@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "mypy>=1.0",
]
