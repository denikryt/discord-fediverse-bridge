server {
    listen 80;
    server_name bridge.bot-test.nachitima.com;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bridge.bot-test.nachitima.com;

    ssl_certificate /etc/letsencrypt/live/bridge.bot-test.nachitima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.bot-test.nachitima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
